name: Claude Security Full Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code + plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add anthropics/claude-plugins-official
          claude plugin install claude-security@claude-plugins-official

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          claude -p "Run a Claude Security scan on the whole repo at medium. I accept the time and token cost; do not ask for confirmation." \
            --permission-mode bypassPermissions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-security-report
          path: CLAUDE-SECURITY-*/
